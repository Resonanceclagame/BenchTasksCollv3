name: Sync implemented tasks to finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy the previously compiled finalpool task tree
        run: |
          set -eu
          git fetch --depth 1 https://github.com/tooluse222/BenchTasksCollv3.git +refs/heads/finalpool:refs/remotes/task-source
          git checkout --detach refs/remotes/task-source
          count=$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)
          [ "$count" -eq 77 ]
          files=$(find tasks/finalpool -type f | wc -l)
          [ "$files" -eq 385 ]
          echo "Copying $files files in $count task directories from tooluse222/finalpool"
          git push --verbose --progress origin HEAD:refs/heads/finalpool
